<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plante Urban Store · Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/logo-circle.png">
<meta name="theme-color" content="#fdfcfc">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="authRoot"></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <img class="logo-l" src="assets/logo-wordmark.png" alt="Plante" width="168">
      <img class="logo-d" src="assets/logo-wordmark-light.png" alt="Plante" width="168">
      <small>Urban Store · Inventario</small>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="userbox" id="userBox"></div>
    <button class="btn theme" data-action="toggleTheme">Cambiar tema</button>
  </aside>
  <main>
    <div class="m-brand"><img class="logo-l" src="assets/logo-wordmark.png" alt="Plante"><img class="logo-d" src="assets/logo-wordmark-light.png" alt="Plante"></div>
    <div class="top"><h1 id="title"></h1><div class="sub" id="today"></div><button class="btn sm logout-top" data-action="logout">Cerrar sesión</button></div>
    <div id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="restoreFile" accept="application/json" hidden>


<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/images.js"></script>
<script src="js/seed.js"></script>
<script src="js/data.js"></script>
<script src="js/store/local.js"></script>
<script src="js/store/supabase.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/inventory.js"></script>
<script src="js/views/pos.js"></script>
<script src="js/views/movements.js"></script>
<script src="js/views/sales.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/users.js"></script>
<script src="js/router.js"></script>
<script src="js/auth.js"></script>
<script src="js/actions.js"></script>
<script src="js/events.js"></script>
<script src="js/main.js"></script>
</body>
</html>
